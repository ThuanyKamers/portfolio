<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found · Thuany Kamers</title>
    <link rel="icon" type="image/svg+xml" href="/portfolio/favicon.svg" />
    <meta name="theme-color" content="#05080f" />
    <style>
      :root { --bg: #05080f; --fg: #f1f5f9; --muted: #94a3b8; --accent: #22d3ee; --ok: #34d399; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background:
          radial-gradient(circle at 20% 10%, rgba(34, 211, 238, 0.08), transparent 45%),
          linear-gradient(rgba(148, 163, 184, 0.06) 1px, transparent 1px) 0 0 / 56px 56px,
          linear-gradient(90deg, rgba(148, 163, 184, 0.06) 1px, transparent 1px) 0 0 / 56px 56px,
          var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .card {
        width: 100%;
        max-width: 520px;
        border: 1px solid rgba(34, 211, 238, 0.25);
        border-radius: 14px;
        background: rgba(8, 12, 20, 0.85);
        overflow: hidden;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 10px 14px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.15);
        font: 12px ui-monospace, "JetBrains Mono", Consolas, monospace;
        color: var(--muted);
      }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(148, 163, 184, 0.3); }
      .bar span:last-child { margin-left: 8px; }
      .body { padding: 28px 22px 26px; font: 14px/1.7 ui-monospace, "JetBrains Mono", Consolas, monospace; }
      .prompt { color: var(--ok); }
      .err { color: #f87171; }
      h1 { margin: 18px 0 6px; font: 600 40px/1.1 system-ui, sans-serif; letter-spacing: -0.02em; }
      h1 span { color: var(--accent); }
      p.note { color: var(--muted); font-family: system-ui, sans-serif; font-size: 15px; }
      a.btn {
        display: inline-block;
        margin-top: 22px;
        padding: 11px 18px;
        border-radius: 10px;
        background: var(--accent);
        color: #031016;
        font: 600 15px system-ui, sans-serif;
        text-decoration: none;
      }
      a.btn:hover { background: #67e8f9; }
      a.btn:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }

      /* Cena 3D: um cubo em wireframe girando sobre um chão de grade em perspectiva */
      .scene { position: relative; height: 200px; perspective: 700px; margin: -28px -22px 14px; overflow: hidden; }
      .floor {
        position: absolute; left: -40%; right: -40%; bottom: 0; height: 160px;
        background:
          linear-gradient(rgba(34, 211, 238, 0.35) 1px, transparent 1px) 0 0 / 40px 40px,
          linear-gradient(90deg, rgba(34, 211, 238, 0.35) 1px, transparent 1px) 0 0 / 40px 40px;
        transform: rotateX(72deg);
        transform-origin: bottom;
        mask-image: linear-gradient(to top, #000 10%, transparent 85%);
        -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 85%);
        animation: floor 2.4s linear infinite;
      }
      @keyframes floor { to { background-position: 0 40px, 0 0; } }
      .tilt { position: absolute; left: 50%; top: 36px; width: 110px; height: 110px; margin-left: -55px; transform-style: preserve-3d; transition: transform 0.2s ease-out; }
      .cube { position: absolute; inset: 0; transform-style: preserve-3d; animation: spin 9s linear infinite; }
      .float { position: absolute; inset: 0; transform-style: preserve-3d; animation: float 3.2s ease-in-out infinite; }
      .face {
        position: absolute; inset: 0;
        display: grid; place-items: center;
        border: 1.5px solid var(--accent);
        background: rgba(6, 18, 26, 0.92);
        box-shadow: inset 0 0 24px rgba(34, 211, 238, 0.25), 0 0 18px rgba(34, 211, 238, 0.25);
        font: 700 46px ui-monospace, "JetBrains Mono", Consolas, monospace;
        color: var(--accent);
        text-shadow: 0 0 12px rgba(34, 211, 238, 0.8);
        backface-visibility: hidden;
      }
      .f1 { transform: translateZ(55px); }
      .f2 { transform: rotateY(90deg) translateZ(55px); }
      .f3 { transform: rotateY(180deg) translateZ(55px); }
      .f4 { transform: rotateY(-90deg) translateZ(55px); }
      .f5 { transform: rotateX(90deg) translateZ(55px); color: var(--ok); border-color: var(--ok); }
      .f6 { transform: rotateX(-90deg) translateZ(55px); font-size: 28px; }
      @keyframes spin { from { transform: rotateX(-18deg) rotateY(0); } to { transform: rotateX(-18deg) rotateY(360deg); } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
      .shadow {
        position: absolute; left: 50%; bottom: 22px; width: 120px; height: 18px; margin-left: -60px;
        border-radius: 50%; background: radial-gradient(rgba(34, 211, 238, 0.45), transparent 70%);
        animation: shadow 3.2s ease-in-out infinite;
      }
      @keyframes shadow { 50% { transform: scale(0.8); opacity: 0.6; } }
      @media (prefers-reduced-motion: reduce) {
        .floor, .cube, .float, .shadow { animation: none; }
        .cube { transform: rotateX(-18deg) rotateY(35deg); }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="bar" aria-hidden="true">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span>~/portfolio</span>
      </div>
      <div class="body">
        <div class="scene" aria-hidden="true">
          <div class="floor"></div>
          <div class="shadow"></div>
          <div class="tilt" id="tilt">
            <div class="float">
              <div class="cube">
                <div class="face f1">4</div>
                <div class="face f2">0</div>
                <div class="face f3">4</div>
                <div class="face f4">?</div>
                <div class="face f5">$_</div>
                <div class="face f6">404</div>
              </div>
            </div>
          </div>
        </div>
        <div><span class="prompt">visitor@portfolio:~$</span> cd <span id="path">this-page</span></div>
        <div class="err">cd: no such file or directory</div>
        <h1><span>404</span> Page not found</h1>
        <p class="note">The link may be broken or the page may have moved.</p>
        <a class="btn" href="/portfolio/">Back to the portfolio</a>
      </div>
    </main>
    <script>
      var p = location.pathname.replace(/^\/portfolio\/?/, '') || 'this-page';
      try { p = decodeURIComponent(p); } catch (e) { /* mantém o caminho como veio */ }
      document.getElementById('path').textContent = p.slice(0, 40);

      // Inclina o cubo seguindo o mouse
      var tilt = document.getElementById('tilt');
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        window.addEventListener('pointermove', function (e) {
          var x = e.clientX / window.innerWidth - 0.5;
          var y = e.clientY / window.innerHeight - 0.5;
          tilt.style.transform = 'rotateX(' + (-y * 25) + 'deg) rotateY(' + (x * 35) + 'deg)';
        });
      }
    </script>
  </body>
</html>
